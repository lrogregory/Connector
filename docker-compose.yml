# === INSP Dataspace — Participante Standalone ===
# Uso: docker compose up -d
# Requer: .env configurado (copie de .env.example)
#
# As imagens Docker são construídas localmente a partir dos launchers.
# Na primeira execução, o start.sh baixa os launchers automaticamente do GitHub.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${PARTICIPANT_ID}-postgres
    environment:
      POSTGRES_USER: edc
      POSTGRES_PASSWORD: edc
      POSTGRES_DB: ${PARTICIPANT_ID}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edc -d ${PARTICIPANT_ID}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  controlplane:
    build:
      context: .
      dockerfile: docker/controlplane.Dockerfile
    container_name: ${PARTICIPANT_ID}-controlplane
    env_file: .env
    environment:
      EDC_FS_CONFIG: /app/config.properties
    ports:
      - "${PORT_BASE}191:8181"
      - "${PORT_BASE}192:8182"
      - "${PORT_BASE}193:8183"
      - "${PORT_BASE}194:8184"
      - "${PORT_BASE}195:8185"
    volumes:
      - ./config/controlplane.properties:/app/config.properties:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8181/api/check/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  dataplane:
    build:
      context: .
      dockerfile: docker/dataplane.Dockerfile
    container_name: ${PARTICIPANT_ID}-dataplane
    env_file: .env
    environment:
      EDC_FS_CONFIG: /app/config.properties
    ports:
      - "${PORT_BASE}281:8181"
      - "${PORT_BASE}282:8182"
      - "${PORT_BASE}283:8183"
    volumes:
      - ./config/dataplane.properties:/app/config.properties:ro
    depends_on:
      controlplane:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    name: ${PARTICIPANT_ID}-pgdata
